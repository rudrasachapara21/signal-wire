services:
  # ---------------------------------------------------------------------------
  # Backend Web Service (Node.js + Express + Prisma + PostgreSQL)
  # ---------------------------------------------------------------------------
  - type: web
    name: signal-wire-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend Static Site (React + Vite + TanStack)
  # ---------------------------------------------------------------------------
  - type: web
    name: signal-wire-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: .output/public
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
